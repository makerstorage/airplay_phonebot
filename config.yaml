robot:
  dry_run: false           # true = print G-code only, no serial connection
  port: /dev/cu.usbmodem21101 # serial port of the machine
  baud: 115200
  home_on_start: false     # never home (user rule): position is set by hand with G92

  # Work area limits in mm (moves outside are refused)
  x_max: 200
  y_max: 200

  # Z heights in mm. Z moves the bed: bigger Z = bed lower, away from the stylus.
  # Z is never homed, so these only hold if the board resets with the stylus
  # just touching the glass (that point = Z0), followed by G92 Z0.3.
  z_up: 5.3                # 5 mm gap above the screen
  z_touch: 0.0             # presses 0.3 mm past first contact (tested 2026-10-31)
  z_at_connect: null       # G92 Z on connect; null = keep the position the board already has

  # Speeds in mm/min
  move_speed: 3000         # X/Y travel with stylus up
  z_speed: 600             # bed up/down; 600 = firmware max (M203 Z10). Watch for skipped steps at 4388 steps/mm
  z_accel: 150             # mm/s^2, firmware default 50 makes taps too long
  swipe_speed: 1500        # X/Y travel with stylus down
  fast_swipe_speed: 6000   # quick flicks, e.g. the home gesture

  tap_hold_ms: 0           # no dwell: the 0.3 mm press + Z travel is enough (tested)
  double_tap_lift: 1.0     # mm lift between the two taps of a double tap
  dwell_in_seconds: false  # Marlin: G4 P is in ms

vision:
  window_owner: uxplay          # app that owns the AirPlay mirror window (UxPlay)
  max_long_edge: 1280      # downscale target for the LLM image
  phone_width: 1170        # iPhone 13 Pro screen resolution (for the crop aspect ratio)
  phone_height: 2532

calib:
  port: 8765               # calibration page: http://<mac-ip>:8765
  screen_box: [68, 46, 132, 185]  # rough phone screen area in machine mm [x0, y0, x1, y1] (2026-10-31, frame set by G92 X100 Y100)
  grid: 3                  # 3x3 = 9 taps
  margin: 0.15             # keep taps away from the screen edges
  settle_s: 1.0            # wait for the mirror to update after a tap
  file: calib.json         # saved result

agent:
  model: claude-opus-5-5
  effort: medium           # low | medium | high | xhigh | max
  max_steps: 80            # model turns before the loop stops
  settle_s: 0.6            # wait after an action before the screenshot (AirPlay lag)
  stable_timeout_s: 3.0    # wait up to this long for animations to stop
  clear_trigger_tokens: 80000  # start clearing old screenshots above this context size
  keep_tool_uses: 12       # recent tool calls kept when clearing
  skills_dir: skills

actuator:
  mode: gcode              # human = you tap by hand from the web page, gcode = the machine taps

web:
  port: 8000               # control page: http://localhost:8000
  fps: 5                   # live phone picture frame rate

teach:
  recordings_dir: recordings    # one folder per teaching session
  skills_dir: skills            # approved skills: skills/<app_id>/SKILL.md (the agent loads them)
  device_profile: iphone-13-pro # written into each recording
  os: ios
  prompt_timeout_s: null        # null = a "do this" prompt waits forever while teaching
  settle_quiet_s: 0.6           # screen still this long = settled
  settle_most_s: 4.0            # stop waiting for a still screen after this long
  change_threshold: 2.0         # grey-level difference that counts as a screen change (inferred steps)
  skill_writer:
    model: claude-opus-5-5
    effort: high
    max_frames: 60              # frames sent per recording; each step's before/after first
