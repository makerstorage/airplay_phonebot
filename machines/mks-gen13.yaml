# MKS Gen 1.3/1.4 board, Marlin 2.1.2.9, generic Marlin defaults (2026-11-14).
description: MKS Gen 1.3, Marlin 2.1.2.9, Cartesian XYZ, A4988 drivers

port: /dev/cu.usbserial-A1083DYR   # FTDI FT232R on the board (confirmed 2026-11-14)
baud: 250000
home_on_start: false     # never home on connect
home_by_order: true      # X/Y home only on the user's order (Home button / --home); taps are refused until then

# Work area limits in mm (firmware software limits are also 0..200)
x_max: 200
y_max: 200
screen_box: [68, 46, 132, 185]  # stand-in for dry runs only; calibration finds the real screen and saves its box

# Z turns a cam (see z_cam below): half turn forward = stylus down, next half turn = up.
# The stylus must be UP when the code connects (it sends G92 Z0).
z_mode: cam
cam_half_turn: 4.0       # Z mm for half a cam turn (8 mm = full turn)
z_up: 5.3                # not used in cam mode
z_touch: 0.0             # not used in cam mode
z_at_connect: null       # not used in cam mode (cam always sends G92 Z0)

# Speeds in mm/min
move_speed: 3000         # X/Y travel with stylus up (firmware max 300 mm/s)
y_steps_per_mm: 100      # 2026-11-14: sent as M92 Y on connect. The firmware's 80 moved Y only 0.8 mm per mm
                         #   (measured on the iPhone's own pixels: X 6.04 px/mm, Y 4.81; with 100: X 6.04, Y 6.03)
z_speed: 1200            # 2026-11-14: tested tap speed (20 mm/s)
z_max_speed: 20          # mm/s, sent as M203 Z on connect (firmware default cap is 5)
z_accel: 500             # mm/s^2, sent as M201 Z on connect (firmware default 100)
swipe_speed: 1500        # X/Y travel with stylus down
fast_swipe_speed: 6000   # quick flicks, e.g. the home gesture

tap_hold_ms: 0           # 2026-11-14: confirmed on the iPhone (100 ms also worked but felt long)
double_tap_lift: 1.0     # mm lift between the two taps of a double tap
dwell_in_seconds: false  # Marlin: G4 P is in ms

# Firmware build, for reference (not sent to the board).
# Generic Marlin defaults, not yet matched to the hardware. EEPROM is off: M92/M203/M201 changes are lost at power-off.
firmware:
  name: Marlin 2.1.2.9
  # Built and flashed from this Mac 2026-11-14 (last flash: X dir fix): ~/Code/Marlin (tag 2.1.2.9, commit 7d300b42).
  # Changes vs stock Configuration.h: MOTHERBOARD BOARD_MKS_GEN_13, INVERT_X_DIR true, INVERT_Y_DIR false. Nothing else.
  # Build: cd ~/Code/Marlin && pio run -e mega2560 (57502 bytes)
  # Flash: arch -x86_64 ~/.platformio/packages/tool-avrdude/avrdude -C ~/.platformio/packages/tool-avrdude/avrdude.conf
  #        -p atmega2560 -c wiring -P <port> -b 115200 -D -U flash:w:.pio/build/mega2560/firmware.hex:i
  # Backup of the firmware before this flash: ~/Code/marlin-backups/original-flash.hex
  board: BOARD_MKS_GEN_13
  kinematics: cartesian
  drivers: A4988
  eeprom: false
  steps_per_mm: {x: 80, y: 80, z: 400, e: 500}   # Y is wrong in the build: overridden by y_steps_per_mm above
  max_speed_mm_s: {x: 300, y: 300, z: 5, e: 25}
  max_accel_mm_s2: {x: 3000, y: 3000, z: 100, e: 10000}
  invert_dir: {x: true, y: false, z: false, e: false}  # 2026-11-14: both flipped vs stock so -X/-Y go toward the min switches (earlier X test was wrong: X driver was faulty, replaced)
  homing: min endstops on X, Y, Z
  bed_size_mm: [200, 200, 200]
  software_endstops: true

# Tested on the machine (M119)
endstops:
  x_min: ok    # 2026-11-14: mechanical switch, open when free, TRIGGERED when pressed
  y_min: ok    # 2026-11-14: optical, open when clear, TRIGGERED when blocked (after fixing its connector)

# Axis directions checked on the machine
directions:
  x: ok        # 2026-11-14: -X moves toward the X-min switch (INVERT_X_DIR true, after X driver replaced)
  y: ok        # 2026-11-14: -Y moves toward the Y-min switch (after INVERT_Y_DIR flip)

# Homing tested on the machine
homing:
  x: ok        # 2026-11-14: G28 X homes to the X-min switch, X0. Note: Marlin lifts Z +5 mm (cam) before homing (Z_CLEARANCE_FOR_HOMING default)
  y: ok        # 2026-11-14: G28 Y homes to the Y-min switch (optical), Y0. No extra Z move (Z was already at 5)
  xy_no_z: ok  # 2026-11-14: G28 X Y R0 homes X and Y, cam does not move (Z stayed 128). Rule: Z never moves while homing; the code sends this.

# Z is a cam that moves the stylus; no Z switch. Tested on the machine.
z_cam:
  mm_per_turn: 8       # 2026-11-14: G1 Z+8 (3200 steps at 400 steps/mm) = exactly one full cam turn, up -> up
  half_turn: down      # 2026-11-14: from up, G1 Z+4 (half turn) = stylus down
  # 2026-11-14: tap confirmed on the real iPhone: G91, G1 Z4 F1200, G1 Z4 F1200, G90 (no hold; 100 ms hold also works)
  #   needs M203 Z20 and M201 Z500 first (firmware defaults Z 5 mm/s, 100 mm/s^2 are too slow); EEPROM off, so send after each connect
  #   tip: 9x7 mm metal (a glued belt piece did not work: not conductive). Z grows +8 per tap; G92 Z0 before it reaches 200.
  # Used by the code through z_mode/cam_half_turn/z_speed/z_max_speed/z_accel/tap_hold_ms above.
